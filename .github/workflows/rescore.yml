name: rescore

# Re-run only the scoring on the converted pages a bench run already uploaded (kept 30 days),
# without converting 1,403 pages again.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: bench run whose out-* and speed artifacts to score
        required: true
      only:
        description: comma-separated candidates to score, empty = all
        default: ""

permissions:
  contents: read
  actions: read

env:
  BENCH_REV: 54a96a6fb6a2bd3b297e59869491db4d3625b711
  PYTHON_VERSION: "3.12"

jobs:
  score:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache/restore@v4
        with:
          path: olmOCR-bench
          key: olmocr-bench-${{ env.BENCH_REV }}
          fail-on-cache-miss: true
      - uses: actions/download-artifact@v5
        with:
          pattern: out-*
          path: out
          merge-multiple: true
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v5
        with:
          name: speed
          path: speed
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install the olmocr-bench checker
        run: |
          pip install --quiet "olmocr[bench,elo]==0.4.27"
          playwright install --with-deps chromium
      - name: Score
        run: |
          python bench/prepare_scoring.py --data olmOCR-bench/bench_data --out out
          bash bench/score.sh olmOCR-bench/bench_data out "${{ inputs.only }}"
      - name: Summarize
        if: always()
        run: |
          set -o pipefail
          python bench/summarize.py --out out --speed speed | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results
          path: |
            out/*.json
            out/*.jsonl
            out/*.txt
            out/results.md
            speed/*.json
            speed/*.jsonl
