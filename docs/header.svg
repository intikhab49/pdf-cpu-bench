<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340"
     viewBox="0 0 1200 340" role="img"
     aria-label="pdf-cpu-bench: 9 PDF-to-Markdown parsers measured on a plain 4-core CPU with
     olmocr-bench. Best score 74.6 percent, mineru (CPU tier).">
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFB020"/>
      <stop offset="55%" stop-color="#FF6B4A"/>
      <stop offset="100%" stop-color="#FF4E88"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF6B4A" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#0A0A14" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0 L0 0 0 28" fill="none" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="340" fill="#0A0A14"/>
  <rect width="1200" height="340" fill="url(#grid)"/>
  <circle cx="1040" cy="70" r="240" fill="url(#fade)"/>

  <text x="64" y="86" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" letter-spacing="3.5" fill="#A3E635">OLMOCR-BENCH
        &#183; 1,403 PDFS &#183; ONE 4-CORE CPU</text>

  <text x="60" y="164" font-family="Georgia,'Times New Roman',serif" font-size="64"
        font-weight="700" fill="url(#grad)">pdf-cpu-bench</text>

  <text x="64" y="204" font-family="-apple-system,Segoe UI,Helvetica,sans-serif" font-size="19" fill="#E8E8F0">9 PDF-to-Markdown parsers
        for RAG, on a plain CPU.</text>
  <text x="64" y="232" font-family="-apple-system,Segoe UI,Helvetica,sans-serif" font-size="19" fill="#8B8BA7">Score, seconds per page, RAM
        and install size. Same machine, same pages.</text>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12">
    <rect x="64" y="262" width="112" height="28" rx="14" fill="none" stroke="#FFB020" stroke-opacity="0.55"/>
    <text x="120" y="281" fill="#FFB020" text-anchor="middle">9 PARSERS</text>
    <rect x="188" y="262" width="120" height="28" rx="14" fill="none" stroke="#A3E635" stroke-opacity="0.55"/>
    <text x="248" y="281" fill="#A3E635" text-anchor="middle">1,403 PDFS</text>
    <rect x="320" y="262" width="150" height="28" rx="14" fill="none" stroke="#5B9BFF" stroke-opacity="0.55"/>
    <text x="395" y="281" fill="#5B9BFF" text-anchor="middle">4 CORES &#183; 16 GB</text>
    <rect x="482" y="262" width="164" height="28" rx="14" fill="none" stroke="#FF4E88" stroke-opacity="0.55"/>
    <text x="564" y="281" fill="#FF4E88" text-anchor="middle">OFFICIAL CHECKER</text>
  </g>

  <text x="790" y="62" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" letter-spacing="2" fill="#8B8BA7">SCORE % &#183;
        8,413 tests</text>
  <g>
    <rect x="790" y="78.0" width="177.2" height="20.9" rx="3" fill="url(#grad)" opacity="1"/>
    <text x="975.2" y="92.4" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" fill="#FFFFFF" font-weight="700">74.6  mineru (CPU tier)</text>
    <rect x="790" y="104.9" width="138.5" height="20.9" rx="3" fill="#8B8BA7" opacity="0.35"/>
    <text x="936.5" y="119.3" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" fill="#8B8BA7" font-weight="400">58.3  marker fast</text>
    <rect x="790" y="131.8" width="126.8" height="20.9" rx="3" fill="#8B8BA7" opacity="0.35"/>
    <text x="924.8" y="146.2" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" fill="#8B8BA7" font-weight="400">53.4  docling</text>
    <rect x="790" y="158.7" width="103.8" height="20.9" rx="3" fill="#8B8BA7" opacity="0.35"/>
    <text x="901.8" y="173.1" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" fill="#8B8BA7" font-weight="400">43.7  marker, no OCR</text>
    <rect x="790" y="185.6" width="96.4" height="20.9" rx="3" fill="#8B8BA7" opacity="0.35"/>
    <text x="894.4" y="200.0" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" fill="#8B8BA7" font-weight="400">40.6  liteparse</text>
    <rect x="790" y="212.4" width="92.9" height="20.9" rx="3" fill="#8B8BA7" opacity="0.35"/>
    <text x="890.9" y="226.9" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" fill="#8B8BA7" font-weight="400">39.1  liteparse, no OCR</text>
    <rect x="790" y="239.3" width="90.2" height="20.9" rx="3" fill="#8B8BA7" opacity="0.35"/>
    <text x="888.2" y="253.8" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" fill="#8B8BA7" font-weight="400">38.0  unstructured</text>
    <rect x="790" y="266.2" width="89.1" height="20.9" rx="3" fill="#8B8BA7" opacity="0.35"/>
    <text x="887.1" y="280.7" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" fill="#8B8BA7" font-weight="400">37.5  pymupdf4llm</text>
    <rect x="790" y="293.1" width="69.6" height="20.9" rx="3" fill="#8B8BA7" opacity="0.35"/>
    <text x="867.6" y="307.6" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" fill="#8B8BA7" font-weight="400">29.3  markitdown</text>
  </g>
</svg>
